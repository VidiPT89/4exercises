<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4 Exercises — JavaScript</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      max-width: 480px;
      width: 100%;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #f59e0b;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .exercises {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      color: #e2e8f0;
      text-decoration: none;
      transition: all 0.2s;
    }
    a:hover {
      border-color: #f59e0b;
      background: #1a1a2e;
      transform: translateY(-2px);
    }
    .emoji { font-size: 1.5rem; }
    .info { display: flex; flex-direction: column; }
    .name { font-weight: 600; font-size: 0.95rem; }
    .desc { font-size: 0.75rem; color: #94a3b8; margin-top: 0.15rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>4 Exercises</h1>
    <p>JavaScript logic, loops, and DOM manipulation.</p>
    <div class="exercises">
      <a href="anagrama.html">
        <span class="emoji">🔤</span>
        <div class="info">
          <span class="name">Anagrama</span>
          <span class="desc">Verifica se duas palavras são anagramas</span>
        </div>
      </a>
      <a href="contador.html">
        <span class="emoji">🔢</span>
        <div class="info">
          <span class="name">Contador de Vogais</span>
          <span class="desc">Conta as vogais numa palavra ou frase</span>
        </div>
      </a>
      <a href="conversor.html">
        <span class="emoji">🌡️</span>
        <div class="info">
          <span class="name">Conversor de Temperatura</span>
          <span class="desc">Converte entre Celsius e Fahrenheit</span>
        </div>
      </a>
      <a href="palindromo.html">
        <span class="emoji">🔁</span>
        <div class="info">
          <span class="name">Palíndromo</span>
          <span class="desc">Verifica se uma palavra é um palíndromo</span>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
